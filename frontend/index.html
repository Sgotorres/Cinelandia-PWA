<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos - Menú Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .category-pill.active { background-color: #ef4444; color: white; }
        .product-img { width: 100%; height: 112px; object-fit: cover; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-20">

    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div>
                <h1 class="text-2xl font-black text-red-600 tracking-tighter">SISTEMA PEDIDOS</h1>
                <div id="mesa-tag" class="text-xs font-bold uppercase text-gray-400">Escanea una mesa</div>
            </div>
            <button onclick="abrirCarrito()" class="relative p-2 bg-gray-100 rounded-full">
                🛒 <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4">
        <div id="categories" class="flex gap-2 overflow-x-auto no-scrollbar py-2 px-4 mb-4">
            </div>

        <div id="menu-grid" class="grid grid-cols-2 gap-4">
            <div class="animate-pulse bg-gray-200 h-40 rounded-xl"></div>
            <div class="animate-pulse bg-gray-200 h-40 rounded-xl"></div>
        </div>
    </main>

    <div id="cart-drawer" class="fixed inset-0 bg-black/50 z-[60] hidden">
        <div class="absolute right-0 top-0 h-full w-80 bg-white shadow-2xl flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
                <h2 class="font-bold text-xl">Tu Pedido</h2>
                <button onclick="cerrarCarrito()" class="text-2xl">&times;</button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
            <div class="p-4 border-t bg-gray-50">
                <div class="flex justify-between mb-4 font-bold text-lg">
                    <span>Total:</span>
                    <span id="cart-total">$0</span>
                </div>
                <button id="btn-confirmar" onclick="enviarPedido()" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold hover:bg-red-700 transition-colors">
                    Confirmar Pedido
                </button>
            </div>
        </div>
    </div>

    <script>
        let menuData = [];
        let carrito = [];
        // Busca donde se define la variable mesaSeleccionada
        const params = new URLSearchParams(window.location.search);
        const mesaSeleccionada = params.get('mesa');

        if (mesaSeleccionada) {
            const tag = document.getElementById('mesa-tag');
            // Esto cambia el texto y asegura que no haya fondos raros
            tag.innerText = `MESA: ${mesaSeleccionada}`;
            tag.className = "text-sm font-black uppercase text-red-600"; // Rojo vibrante sobre blanco
        }

        async function cargarMenu() {
            try {
                const res = await fetch('http://localhost:3000/menu');
                menuData = await res.json();
                
                // LIMPIEZA CRUCIAL: Borra el mensaje de error o carga antes de renderizar
                document.getElementById('menu-grid').innerHTML = ''; 
                
                generarCategorias();
                renderMenu(menuData);
            } catch (e) {
                console.error("Error al cargar:", e);
                document.getElementById('menu-grid').innerHTML = '<p class="col-span-full text-center py-10">Error al conectar con el servidor.</p>';
            }
        }

        function generarCategorias() {
            const container = document.getElementById('categories');
            
            // Si el contenedor no existe, detenemos la función para que no de error
            if (!container) return;

            // Creamos la lista de categorías únicas de tu base de datos
            const cats = ['Todos', 'Recomendados', ...new Set(menuData.map(p => p.categoria))];
            
            container.innerHTML = cats.map(c => {
                let texto = c;
                let claseExtra = "";
                
                if (c === 'Recomendados') {
                    texto = "⭐ Recomendados";
                    claseExtra = "text-red-600 font-bold";
                } else if (c === 'Pizzas') {
                    texto = "🍕 Pizzas";
                } else if (c === 'Bebidas') {
                    texto = "🥤 Bebidas";
                }

                return `
                    <button onclick="filtrar('${c}')" 
                        class="category-pill ${c === 'Todos' ? 'active' : ''} ${claseExtra} px-6 py-2 bg-white rounded-full text-sm font-bold shadow-sm whitespace-nowrap">
                        ${texto}
                    </button>
                `;
            }).join('');
        }

        function renderMenu(items) {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = items.map(p => `
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 flex flex-col">
                    <img src="${p.imagen_url}" class="product-img" alt="${p.nombre}">
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="font-bold text-sm text-gray-800 leading-tight">${p.nombre}</h3>
                        <p class="text-xs text-gray-400 mt-1 flex-1">${p.descripcion || ''}</p>
                        <div class="flex justify-between items-center mt-3">
                            <span class="font-black text-red-600">$${(parseFloat(p.precio) || 0).toFixed(2)}</span>
                            <button onclick="agregar('${p.id}')" class="bg-gray-900 text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function agregar(id) {
            const prod = menuData.find(p => p.id == id);
            const existe = carrito.find(item => item.id == id);
            if (existe) { existe.cantidad++; } 
            else { carrito.push({...prod, cantidad: 1}); }
            actualizarUI();
        }

        function actualizarUI() {
            const count = carrito.reduce((acc, item) => acc + item.cantidad, 0);
            document.getElementById('cart-count').innerText = count;
            
            const total = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);
            document.getElementById('cart-total').innerText = `$${total.toLocaleString()}`;

            document.getElementById('cart-items').innerHTML = carrito.map(item => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg">
                    <div>
                        <p class="font-bold text-sm">${item.nombre}</p>
                        <p class="text-xs text-gray-500">${item.cantidad} x $${parseFloat(item.precio).toLocaleString()}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="cambiarCant('${item.id}', -1)" class="w-6 h-6 border rounded">-</button>
                        <span class="text-sm font-bold">${item.cantidad}</span>
                        <button onclick="cambiarCant('${item.id}', 1)" class="w-6 h-6 border rounded">+</button>
                    </div>
                </div>
            `).join('');
        }

        function cambiarCant(id, delta) {
            const idx = carrito.findIndex(i => i.id == id);
            carrito[idx].cantidad += delta;
            if (carrito[idx].cantidad <= 0) carrito.splice(idx, 1);
            actualizarUI();
        }

        async function enviarPedido() {
            if (!mesaSeleccionada) return alert("Por favor, escanea un código QR válido de mesa.");
            if (carrito.length === 0) return alert("El carrito está vacío.");

            const btn = document.getElementById('btn-confirmar');
            btn.disabled = true;
            btn.innerText = "Enviando...";

            try {
                const res = await fetch('http://localhost:3000/pedidos', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        mesa: parseInt(mesaSeleccionada),
                        carrito: carrito.map(item => ({
                            producto_id: item.id,
                            cantidad: item.cantidad,
                            precio_unitario: item.precio
                        }))
                    })
                });

                if (res.ok) {
                    alert("¡Pedido enviado con éxito!");
                    carrito = [];
                    actualizarUI();
                    cerrarCarrito();
                } else {
                    const err = await res.json();
                    alert("Error: " + err.error);
                }
            } catch (e) {
                alert("Error de conexión.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Confirmar Pedido";
            }
        }

        function abrirCarrito() { document.getElementById('cart-drawer').classList.remove('hidden'); }
        function cerrarCarrito() { document.getElementById('cart-drawer').classList.add('hidden'); }
        function filtrar(cat) {
            let productosFiltrados;

            if (cat === 'Todos') {
                productosFiltrados = menuData;
            } else if (cat === 'Recomendados') {
                // Aquí filtramos por la columna booleana que añadimos ayer
                productosFiltrados = menuData.filter(p => p.es_recomendado === true);
            } else {
                // Filtro normal por nombre de categoría
                productosFiltrados = menuData.filter(p => p.categoria === cat);
            }

            renderMenu(productosFiltrados);

            // Lógica para que el botón se vea "activo" (rojo) al hacer clic
            document.querySelectorAll('.category-pill').forEach(btn => {
                // Limpiamos el texto para comparar (quitamos emojis para que no falle)
                const btnText = btn.innerText.replace(/[^\w]/g, ''); 
                const catClean = cat.replace(/[^\w]/g, '');
                
                btn.classList.toggle('active', btnText.includes(catClean));
            });
        }
        cargarMenu();
    </script>
</body>
</html>
