<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Sistema de Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-btn.active { background-color: #ef4444; color: white; }
        .tab-btn:not(.active) { color: #6b7280; }
        .tab-btn:not(.active):hover { background-color: #f3f4f6; }
        .tab-content.hidden { display: none; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="loader-inicial" class="fixed inset-0 bg-gray-900 flex flex-col items-center justify-center z-[100] transition-opacity duration-500">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-11/12 max-w-md text-center">
            <h1 class="text-3xl font-black text-red-600 mb-6 tracking-tighter">CINELANDIA CORE</h1>
            <div class="flex justify-center items-center gap-3 mb-2">
                <div class="w-4 h-4 bg-red-600 rounded-full animate-bounce"></div>
                <div class="w-4 h-4 bg-red-600 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-4 h-4 bg-red-600 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            </div>
            <p id="loader-texto" class="text-gray-500 font-bold mt-4 animate-pulse">Autenticando sistema base...</p>
        </div>
    </div>

    <div id="dashboard-principal" class="hidden">
        <nav class="bg-white shadow-md sticky top-0 z-50">
            <div class="max-w-6xl mx-auto px-4">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center gap-2">
                        <span class="text-xl font-black text-red-600 tracking-tighter">ADMIN PANEL</span>
                        <div class="bg-green-500 h-2 w-2 rounded-full animate-pulse"></div>
                    </div>
                    <div class="flex gap-2 border-l pl-2">
                        <button onclick="verTab('tab-pedidos')" class="tab-btn active text-xs md:text-sm font-bold px-3 py-2 rounded-lg transition">📋 Pedidos</button>
                        <button onclick="verTab('tab-inventario')" class="tab-btn text-xs md:text-sm font-bold px-3 py-2 rounded-lg transition">🍕 Inventario</button>
                        <button onclick="verTab('tab-historial')" class="tab-btn text-xs md:text-sm font-bold px-3 py-2 rounded-lg transition">📊 Historial</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto p-4 md:p-8">
            
            <section id="tab-pedidos" class="tab-content">
                <header class="mb-8 flex justify-between items-end">
                    <div>
                        <h1 id="titulo-pedidos" class="text-3xl font-black text-gray-900 tracking-tight transition-all">PEDIDOS EN COCINA</h1>
                        <p class="text-gray-500">Gestión de comandas en tiempo real</p>
                    </div>
                </header>
                <div id="grid-pedidos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="col-span-full text-center py-20 text-gray-400 font-medium">Cargando pedidos...</div>
                </div>
            </section>

            <section id="tab-inventario" class="tab-content hidden">
                <header class="mb-8">
                    <h1 class="text-3xl font-black text-gray-900 tracking-tight">GESTIÓN DE MENÚ</h1>
                    <p class="text-gray-500">Marca tus platos estrella y controla el stock</p>
                </header>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Producto</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Categoría</th>
                                <th class="px-6 py-4 text-center text-xs font-bold text-gray-500 uppercase">Acciones Rápidas</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-inventario" class="divide-y divide-gray-200 bg-white">
                        </tbody>
                    </table>
                </div>
            </section>

            <section id="tab-historial" class="tab-content hidden">
                <header class="mb-8">
                    <h1 class="text-3xl font-black text-gray-900 tracking-tight">RESUMEN DE VENTAS</h1>
                    <p class="text-gray-500">Rendimiento del negocio hoy</p>
                </header>
                <div id="stats-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                </div>
            </section>

        </main>
    </div>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <script>
        const API_BASE = 'http://localhost:3000';
        // CLAVE DE SISTEMA M2M (Machine to Machine)
        const SYSTEM_SECRET = "cinelandia2026"; 

        // --- INYECCIÓN AUTOMÁTICA DE CABECERAS ---
        function getAuthHeaders() {
            const token = sessionStorage.getItem('adminToken');
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        // --- AUTO-LOGIN SILENCIOSO (Llamado al iniciar la app) ---
        async function autoLoginSilencioso() {
            try {
                const res = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: SYSTEM_SECRET })
                });

                if (res.ok) {
                    const data = await res.json();
                    sessionStorage.setItem('adminToken', data.token); 
                    
                    // Quitar loader y mostrar dashboard
                    const loader = document.getElementById('loader-inicial');
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.classList.add('hidden');
                        document.getElementById('dashboard-principal').classList.remove('hidden');
                        cargarPedidos(); // Carga inicial
                    }, 500);
                } else {
                    document.getElementById('loader-texto').innerText = "❌ Clave de sistema rechazada. Revisa el backend.";
                    document.getElementById('loader-texto').classList.remove('animate-pulse', 'text-gray-500');
                    document.getElementById('loader-texto').classList.add('text-red-500');
                }
            } catch (error) {
                console.warn("Backend no disponible. Reintentando...");
                document.getElementById('loader-texto').innerText = "⏳ Conectando con los motores del backend...";
                setTimeout(autoLoginSilencioso, 3000); // Polling: Si el backend está apagado, reintenta
            }
        }

        // Disparar el login al cargar la ventana
        window.addEventListener('DOMContentLoaded', autoLoginSilencioso);

        // --- GESTIÓN DE EXPIRACIÓN DEL TOKEN ---
        async function fetchSeguro(url, options = {}) {
            options.headers = getAuthHeaders();
            let res = await fetch(url, options);
            
            // Si el token expira o es inválido, auto-renovar sin interrumpir al admin
            if (res.status === 401 || res.status === 403) {
                console.log("Token expirado. Auto-renovando sesión...");
                await autoLoginSilencioso();
                options.headers = getAuthHeaders(); // Actualizar cabeceras con el nuevo token
                res = await fetch(url, options);    // Reintentar la petición original
            }
            return res;
        }

        // --- CONEXIÓN EN TIEMPO REAL (SOCKET.IO) ---
        const socket = io(API_BASE);

        function reproducirCampana() {
            const audio = new Audio('https://actions.google.com/sounds/v1/alarms/dinner_bell_triangle.ogg');
            audio.play().catch(e => console.log("Audio bloqueado temporalmente."));
        }

        socket.on('nuevo_pedido_recibido', () => {
            reproducirCampana();
            cargarPedidos(); 
            const titulo = document.getElementById('titulo-pedidos');
            titulo.classList.add('text-red-500', 'animate-bounce');
            setTimeout(() => titulo.classList.remove('text-red-500', 'animate-bounce'), 3000);
        });

        // --- LÓGICA DE NAVEGACIÓN ---
        function verTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(section => section.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (tabId === 'tab-pedidos') cargarPedidos();
            if (tabId === 'tab-inventario') cargarInventario();
            if (tabId === 'tab-historial') cargarStats();
        }

        // --- GESTIÓN DE PEDIDOS ---
        async function cargarPedidos() {
            try {
                const res = await fetchSeguro(`${API_BASE}/admin/pedidos`);
                const pedidos = await res.json();

                // NUEVO: Validación de tipo de dato
                if (!Array.isArray(pedidos)) {
                    console.error("Error del servidor:", pedidos);
                    document.getElementById('grid-pedidos').innerHTML = `<div class="col-span-full text-center py-20 text-red-500 font-bold">Error interno: No se pudo procesar la lista de pedidos.</div>`;
                    return;
                }
                
                // ... el resto del código sigue igual
                const grid = document.getElementById('grid-pedidos');

                if (pedidos.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400">No hay pedidos pendientes por ahora.</div>`;
                    return;
                }

                grid.innerHTML = pedidos.map(p => `
                    <div class="bg-white rounded-2xl shadow-sm border-t-4 ${getEstadoColor(p.estado)} p-6 transition-all hover:shadow-md">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Mesa ${p.mesa}</span>
                                <h3 class="text-lg font-black text-gray-800">Pedido #${p.id}</h3>
                                <p class="text-xs text-gray-400">${new Date(p.fecha).toLocaleTimeString()}</p>
                            </div>
                            <span class="bg-gray-100 text-gray-800 text-[10px] font-bold px-2 py-1 rounded-md uppercase">${p.estado}</span>
                        </div>
                        
                        <div class="space-y-3 mb-6">
                            ${p.items.map(item => `
                                <div class="flex justify-between text-sm border-b border-gray-50 pb-2">
                                    <span class="text-gray-600"><span class="font-bold text-red-600">${item.cantidad}x</span> ${item.nombre}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="flex flex-col gap-3">
                            <select onchange="actualizarEstado(${p.id}, this.value)" 
                                    class="w-full bg-gray-50 border-none text-sm font-bold rounded-xl p-3 focus:ring-2 focus:ring-red-500 transition cursor-pointer">
                                <option value="pendiente" ${p.estado === 'pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
                                <option value="cocinando" ${p.estado === 'cocinando' ? 'selected' : ''}>👨‍🍳 Cocinando</option>
                                <option value="listo" ${p.estado === 'listo' ? 'selected' : ''}>✅ Listo</option>
                                <option value="finalizado" ${p.estado === 'finalizado' ? 'selected' : ''}>🏁 Finalizado</option>
                            </select>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error al cargar pedidos:", error);
            }
        }

        async function actualizarEstado(id, nuevoEstado) {
            try {
                const res = await fetchSeguro(`${API_BASE}/pedidos/${id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({estado: nuevoEstado})
                });
                if (res.ok) cargarPedidos();
            } catch (e) { alert("Error al actualizar estado"); }
        }

        function getEstadoColor(estado) {
            switch(estado) {
                case 'pendiente': return 'border-yellow-400';
                case 'cocinando': return 'border-orange-500';
                case 'listo': return 'border-green-500';
                default: return 'border-gray-200';
            }
        }

        // --- GESTIÓN DE INVENTARIO ---
        async function cargarInventario() {
            try {
                // Menú es ruta pública, no necesita token, usamos fetch normal
                const res = await fetch(`${API_BASE}/menu?admin=true`);
                const productos = await res.json();
                const tbody = document.getElementById('tabla-inventario');
                
                tbody.innerHTML = productos.map(p => `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4">
                            <div class="font-bold text-gray-800">${p.nombre}</div>
                            <div class="text-xs text-gray-400">$${parseFloat(p.precio).toFixed(2)}</div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="text-xs font-bold px-2 py-1 bg-gray-100 rounded text-gray-600 uppercase">${p.categoria}</span>
                        </td>
                        <td class="px-6 py-4 text-center flex justify-center gap-2">
                            <button onclick="toggleRecomendado(${p.id}, ${p.es_recomendado})" 
                                    class="text-xs font-bold px-4 py-2 rounded-full transition-all ${p.es_recomendado ? 'bg-yellow-100 text-yellow-700 border border-yellow-200 hover:bg-yellow-200' : 'bg-gray-100 text-gray-400 border border-transparent hover:bg-gray-200'}">
                                ${p.es_recomendado ? '⭐ RECOMENDADO' : 'MARCAR'}
                            </button>
                            
                            <button onclick="toggleDisponibilidad(${p.id}, ${p.disponible})" 
                                    class="text-xs font-bold px-4 py-2 rounded-full transition-all ${p.disponible !== false ? 'bg-green-100 text-green-700 border border-green-200 hover:bg-green-200' : 'bg-red-100 text-red-700 border border-red-200 hover:bg-red-200'}">
                                ${p.disponible !== false ? '✅ DISPONIBLE' : '❌ AGOTADO'}
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) { console.error("Error en inventario", e); }
        }

        async function toggleRecomendado(id, estadoActual) {
            try {
                await fetchSeguro(`${API_BASE}/productos/${id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ es_recomendado: !estadoActual })
                });
                cargarInventario();
            } catch (e) { alert("Error al actualizar"); }
        }

        async function toggleDisponibilidad(id, estadoActual) {
            try {
                await fetchSeguro(`${API_BASE}/productos/${id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ disponible: !estadoActual })
                });
                cargarInventario(); 
            } catch (e) { alert("Error al actualizar"); }
        }

        // --- GESTIÓN DE ESTADÍSTICAS ---
        async function cargarStats() {
            try {
                const res = await fetchSeguro(`${API_BASE}/admin/stats-hoy`);
                const stats = await res.json();
                const container = document.getElementById('stats-container');
                
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-green-500">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Ingresos de Hoy</p>
                        <p class="text-3xl font-black text-gray-900">$${parseFloat(stats.ingresos_totales).toFixed(2)}</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Pedidos Totales</p>
                        <p class="text-3xl font-black text-gray-900">${stats.total_pedidos}</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-500">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Más Vendido</p>
                        <p class="text-xl font-black text-gray-900">${stats.top_producto || 'Sin ventas'}</p>
                    </div>
                `;
            } catch (e) { console.error("Error en stats", e); }
        }
    </script>
</body>
</html>
